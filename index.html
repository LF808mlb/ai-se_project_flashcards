<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Study Deck</title>
    <meta name="author" content="Lesley Fukushima" />
    <meta
      name="description"
      content="Flash Study Deck is designed to help users study technical concepts effectively using digital flashcards."
    />
    <meta
      name="keywords"
      content="flashcard, flashcards, study, aid, aids, deck, flash"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/index.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>
    <main id="home" class="page__main-content">
      <section id="gallery" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="card-template">
              <li class="card card_color_green">
                <a class="card__link" href="#"></a>
                <h3 class="card__title"></h3>
                <div class="card__row">
                  <button
                    type="button"
                    aria-label="Show number of cards"
                    class="card__count-btn"
                  ></button>
                  <button
                    type="button"
                    aria-label="Delete deck"
                    class="card__btn card__btn_type_delete"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button type="button" class="gallery__new-card-btn">
            + New Deck
          </button>
        </div>
      </section>
    </main>
    <section id="not-found" class="not-found">
      <h2 class="not-found__status-code">404</h2>
      <p class="not-found__text">404 Not Found</p>
    </section>

    <section id="carousel" class="carousel">
      <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
      <div class="carousel__grid">
        <button
          type="button"
          class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          aria-label="Go to previous card"
          disabled
        ></button>
        <div class="carousel__card">
          <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
        </div>
        <button
          type="button"
          class="carousel__btn carousel__btn_type_right"
          aria-label="Next card"
        ></button>
      </div>
      <button
        type="button"
        class="carousel__btn carousel__btn_type_flip"
        aria-label="Flip card over"
      ></button>
    </section>

    <section id="deck-view" class="gallery">
      <div class="gallery__header">
        <h2 class="gallery__title"></h2>
        <button type="button" class="gallery__practice-btn">Practice</button>
      </div>
      <div class="wrapping-row">
        <ul class="gallery__list wrapping-row__display-contents"></ul>
        <button
          type="button"
          class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
        >
          + New Card
        </button>
        <template id="deck-card-template">
          <li class="card">
            <a href="#"></a>
            <h3 class="card__title"></h3>
            <div class="card__row">
              <p class="card__count"></p>
              <button
                type="button"
                aria-label="Show number of cards"
                class="card__count-btn"
              ></button>
            </div>
          </li>
        </template>
      </div>
    </section>
    <section id="new-deck-view" class="new-deck-view">
      <h2 class="new-deck-view__title">New Deck</h2>
      <form class="new-deck-view__form" id="new-deck-view-form">
        <fieldset class="new-deck-view__color-picker">
          <legend class="new-deck-view__legend">Pick the deck color</legend>
          <label class="new-deck-view__color-label" for="green">
            <input
              class="new-deck-view__color-input new-deck-view__color-input_color_green"
              aria-label="Green"
              name="color"
              id="green"
              value="#64D583"
              type="radio"
              checked
            />
          </label>
          <label class="new-deck-view__color-label" for="blue">
            <input
              class="new-deck-view__color-input new-deck-view__color-input_color_blue"
              aria-label="Blue"
              name="color"
              id="blue"
              value="#91A8F9"
              type="radio"
            />
          </label>
          <label class="new-deck-view__color-label" for="purple">
            <input
              class="new-deck-view__color-input new-deck-view__color-input_color_purple"
              aria-label="Purple"
              name="color"
              id="purple"
              value="#AA8EF0"
              type="radio"
            />
          </label>
          <label class="new-deck-view__color-label" for="pink">
            <input
              class="new-deck-view__color-input new-deck-view__color-input_color_pink"
              aria-label="Pink"
              name="color"
              id="pink"
              value="#EE92D7"
              type="radio"
            />
          </label>
          <label class="new-deck-view__color-label" for="orange">
            <input
              class="new-deck-view__color-input new-deck-view__color-input_color_orange"
              aria-label="Orange"
              name="color"
              id="orange"
              value="#EE955E"
              type="radio"
            />
          </label>
          <label class="new-deck-view__color-label" for="yellow">
            <input
              class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
              aria-label="Yellow"
              name="color"
              id="yellow"
              value="#F5D770"
              type="radio"
            />
          </label>
        </fieldset>
        <label class="new-deck-view__json-label">
          <span class="new-deck-view__json-title"
            >Write the JSON array of cards so that it matches this schema</span>
          <textarea
            name="cards-json"
            rows="8"
            cols="40"
            class="new-deck-view__json-textarea"
            placeholder='{
  "name": "Deck Name",
  "cards": [
    { 
      "question": "Question?",
      "answer": "Answer"
    },
    ...
  ]
}'
></textarea>
          ></textarea>
        </label>
        <div class="modal" id="error-modal">
          <div class="modal__content">
            <h2 class="modal__title">An error has occurred</h2>
            <p class="modal__error"></p>
            <button type="button" aria-label="Close" class="modal__close-btn">Dismiss</button>
          </div>
        </div>
        <button type="submit" class="new-deck-view__submit-btn" disabled>
          Create the Deck
        </button>

      </form>
    </section>

    <section id="about-view" class="about">
  <pre><code>// First line of code
// Second line of code
// Third line of code
</code></pre>
</section>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Lesley Fukushima</p>
    </footer>
    <script>
      // Router logic for showing/hiding sections
      const homeSection = document.getElementById("home");
      const notFoundSection = document.getElementById("not-found");
      const carouselSection = document.getElementById("carousel");
      const deckViewSection = document.getElementById("deck-view");
      const newDeckViewSection = document.getElementById("new-deck-view");
      const aboutSection = document.getElementById("about-view");

      function hideAllSections() {
        homeSection.hidden = true;
        notFoundSection.hidden = true;
        carouselSection.hidden = true;
        deckViewSection.hidden = true;
        newDeckViewSection.hidden = true;
        if (aboutSection) aboutSection.hidden = true;
      }
      function router() {
        hideAllSections();
        const hash = window.location.hash;
        if (hash === "#about") {
          aboutSection.hidden = false;
        } else if (hash === "#home" || hash === "" || hash === "#/") {
          homeSection.hidden = false;
        } else if (hash.startsWith("#deck/")) {
          deckViewSection.hidden = false;
        } else if (hash.startsWith("#carousel/")) {
          carouselSection.hidden = false;
        } else if (hash === "#new-deck-view") {
          newDeckViewSection.hidden = false;
        } else {
          notFoundSection.hidden = false;
        }
      }

      window.addEventListener("hashchange", router);
      window.addEventListener("DOMContentLoaded", router);

      function renderHome() {
        hideAllSections();
        homeSection.hidden = false;
        if (aboutSection) aboutSection.hidden = true;
      }

      function renderNotFound() {
        hideAllSections();
        notFoundSection.hidden = false;
        if (aboutSection) aboutSection.hidden = true;
      }

      function renderCarousel() {
        hideAllSections();
        carouselSection.hidden = false;
        if (aboutSection) aboutSection.hidden = true;
      }

      function renderDeckView() {
        hideAllSections();
        deckViewSection.hidden = false;
        if (aboutSection) aboutSection.hidden = true;
      }

      function renderNewDeckView() {
        hideAllSections();
        newDeckViewSection.hidden = false;
        if (aboutSection) aboutSection.hidden = true;
      }

      function renderAbout() {
        hideAllSections();
        if (aboutSection) aboutSection.hidden = false;
      }

      function router() {
        const hash = window.location.hash.replace("#", "");
        switch (hash) {
          case "":
          case "home":
            renderHome();
            break;
          case "carousel":
            renderCarousel();
            break;
          case "deck-view":
            renderDeckView();
            break;
          case "new-deck-view":
            renderNewDeckView();
            break;
          case "about":
            renderAbout();
            break;
          default:
            renderNotFound();
        }
      }

      window.addEventListener("hashchange", router);
      window.addEventListener("DOMContentLoaded", () => {
        router();
        // Add event listener for New Deck button in home view
        const newDeckBtn = document.querySelector(
          "#home .gallery__new-card-btn",
        );
        if (newDeckBtn) {
          newDeckBtn.addEventListener("click", () => {
            window.location.hash = "new-deck-view";
          });
        }
      });
    </script>
    <script type="module" src="assets/js/index.js"></script>
  </body>
</html>
